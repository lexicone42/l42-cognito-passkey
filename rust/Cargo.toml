[package]
name = "l42-token-handler"
version = "0.22.0"
edition = "2024"
description = "Rust Token Handler backend for l42-cognito-passkey"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", features = ["json", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
lambda_http = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
# One crypto stack: HMAC, SHA-256 and the JWT backend all come from aws-lc.
aws-lc-rs = "1"
base64 = "0.22"
cookie = "0.18"
cedar-policy = "4"
ciborium = "0.2"
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
thiserror = "2"
dashmap = "6"
urlencoding = "2"
subtle = "2"

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
rsa = { version = "0.9", features = ["pem"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
ciborium = "0.2"
